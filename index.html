      exchange: { id: &quot;exchange&quot;, label: &quot;Exchange&quot;, summary: &quot;A process in which entities transfer resources, information, or value.&quot;, canonicalPath: [&quot;Reality&quot;, &quot;Category&quot;, &quot;Process&quot;, &quot;Exchange&quot;] },
      learning: { id: &quot;learning&quot;, label: &quot;Learning&quot;, summary: &quot;A process through which knowledge, capability, or behaviour changes through experience.&quot;, canonicalPath: [&quot;Reality&quot;, &quot;Category&quot;, &quot;Process&quot;, &quot;Learning&quot;] },
      production: { id: &quot;production&quot;, label: &quot;Production&quot;, summary: &quot;A process that creates goods, services, information, or other valued outputs.&quot;, canonicalPath: [&quot;Reality&quot;, &quot;Category&quot;, &quot;Process&quot;, &quot;Production&quot;] },
      ownership: { id: &quot;ownership&quot;, label: &quot;Ownership&quot;, summary: &quot;A relationship that assigns recognised possession, control, or rights over something.&quot;, canonicalPath: [&quot;Reality&quot;, &quot;Category&quot;, &quot;Relationship&quot;, &quot;Ownership&quot;] },
      dependency: { id: &quot;dependency&quot;, label: &quot;Dependency&quot;, summary: &quot;A relationship in which one entity relies on another.&quot;, canonicalPath: [&quot;Reality&quot;, &quot;Category&quot;, &quot;Relationship&quot;, &quot;Dependency&quot;] },
      communication: { id: &quot;communication&quot;, label: &quot;Communication&quot;, summary: &quot;A relationship formed through the exchange of signals or meaning.&quot;, canonicalPath: [&quot;Reality&quot;, &quot;Category&quot;, &quot;Relationship&quot;, &quot;Communication&quot;] },
      cooperation: { id: &quot;cooperation&quot;, label: &quot;Cooperation&quot;, summary: &quot;A relationship in which parties coordinate toward compatible outcomes.&quot;, canonicalPath: [&quot;Reality&quot;, &quot;Category&quot;, &quot;Relationship&quot;, &quot;Cooperation&quot;] },
      competition: { id: &quot;competition&quot;, label: &quot;Competition&quot;, summary: &quot;A relationship in which parties pursue scarce or incompatible outcomes.&quot;, canonicalPath: [&quot;Reality&quot;, &quot;Category&quot;, &quot;Relationship&quot;, &quot;Competition&quot;] },
      &quot;social-individuals&quot;: { id: &quot;social-individuals&quot;, label: &quot;Individuals&quot;, summary: &quot;People acting as social agents with identities, roles, and choices.&quot;, canonicalPath: [&quot;Reality&quot;, &quot;Domain&quot;, &quot;Social&quot;, &quot;Individuals&quot;] },
      &quot;social-relationships&quot;: { id: &quot;social-relationships&quot;, label: &quot;Relationships&quot;, summary: &quot;Interpersonal connections through which trust, influence, and obligation form.&quot;, canonicalPath: [&quot;Reality&quot;, &quot;Domain&quot;, &quot;Social&quot;, &quot;Relationships&quot;] },
      groups: { id: &quot;groups&quot;, label: &quot;Groups&quot;, summary: &quot;Small social collectives shaped by membership, norms, and interaction.&quot;, canonicalPath: [&quot;Reality&quot;, &quot;Domain&quot;, &quot;Social&quot;, &quot;Groups&quot;] },
      organisations: { id: &quot;organisations&quot;, label: &quot;Organisations&quot;, summary: &quot;Coordinated social systems with roles, goals, and formal boundaries.&quot;, canonicalPath: [&quot;Reality&quot;, &quot;Domain&quot;, &quot;Social&quot;, &quot;Organisations&quot;] },
      institutions: { id: &quot;institutions&quot;, label: &quot;Institutions&quot;, summary: &quot;Durable rules and structures that organise collective behaviour.&quot;, canonicalPath: [&quot;Reality&quot;, &quot;Domain&quot;, &quot;Social&quot;, &quot;Institutions&quot;] },
      culture: { id: &quot;culture&quot;, label: &quot;Culture&quot;, summary: &quot;Shared meanings, values, symbols, and practices transmitted across people.&quot;, canonicalPath: [&quot;Reality&quot;, &quot;Domain&quot;, &quot;Social&quot;, &quot;Culture&quot;] },
      &quot;social-communication&quot;: { id: &quot;social-communication&quot;, label: &quot;Communication&quot;, summary: &quot;The creation and exchange of meaning between social actors.&quot;, canonicalPath: [&quot;Reality&quot;, &quot;Domain&quot;, &quot;Social&quot;, &quot;Communication&quot;] },
      governance: { id: &quot;governance&quot;, label: &quot;Governance&quot;, summary: &quot;The processes through which collective decisions, authority, and accountability are organised.&quot;, canonicalPath: [&quot;Reality&quot;, &quot;Domain&quot;, &quot;Social&quot;, &quot;Governance&quot;] },
    };

    const canonicalDimensions = [&quot;Domain&quot;, &quot;Category&quot;, &quot;Time&quot;, &quot;Scale&quot;, &quot;Perspective&quot;];
    const nodesLayer = root.querySelector(&quot;[data-orbit-nodes]&quot;);
    const connectionsLayer = root.querySelector(&quot;[data-orbit-connections]&quot;);
    const selectedLabel = root.querySelector(&quot;[data-selected-label]&quot;);
    const selectedSummary = root.querySelector(&quot;[data-selected-summary]&quot;);
    const actionButton = root.querySelector(&quot;[data-orbit-action]&quot;);
    const backButton = root.querySelector(&quot;[data-orbit-back]&quot;);
    const pathElement = root.querySelector(&quot;[data-orbit-path]&quot;);
    const toast = root.querySelector(&quot;[data-orbit-toast]&quot;);
    const svgNamespace = &quot;http://www.w3.org/2000/svg&quot;;
    const history = [&quot;reality&quot;];
    let selectedId = &quot;reality&quot;;
    let toastTimer;

    const currentId = () =&gt; history[history.length - 1];
    const currentNode = () =&gt; ontology[currentId()];

    const positionChildren = (parent) =&gt; {
      if (parent.positions) return parent.positions;
      const count = parent.children.length;
      const radiusX = count &lt;= 5 ? 38 : 41;
      const radiusY = count &lt;= 5 ? 35 : 40;
      return parent.children.map((_, index) =&gt; {
        const angle = (-90 + (360 / count) * index) * (Math.PI / 180);
        return [50 + Math.cos(angle) * radiusX, 50 + Math.sin(angle) * radiusY];
      });
    };

    const expansionPrompt = (node) =&gt; `Canonical Ontology Expansion Contract\n\nYou are expanding the Canonical Reality Ontology.\n\nThis ontology is the source of truth. Do not redesign, rename, merge, remove, or reorder existing canonical nodes unless explicitly instructed.\n\nExpand: ${node.canonicalPath.join(&quot; → &quot;)}\n\nExpansion Rules\n1. Expand only the requested node.\n2. Expand exactly one level deeper.\n3. Return between 5 and 10 Pareto-essential children.\n4. Children should collectively cover the parent.\n5. Children should be mutually exclusive where practical.\n6. Prefer timeless concepts over current implementations, tools, or technologies.\n7. Give every child a name and one-line description.\n8. Preserve the existing ontology naming conventions.\n9. If multiple taxonomies exist, choose the most widely accepted and explain the rationale.\n10. Never expand grandchildren unless explicitly requested.\n\nOutput Format\nParent\n├── Child 1\n│   One-line description\n├── Child 2\n│   One-line description\n…\n\nValidation Checklist\n✓ One level only\n✓ Pareto: 5–10 children\n✓ Canonical terminology\n✓ No duplicated concepts\n✓ Covers the parent\n✓ Suitable for long-term navigation\n✓ Stable across industries and time\n\nIf the requested node exists, expand it. If it does not exist, explain why and suggest the closest valid canonical node. Never modify the canonical ontology while expanding it.`;

    const showToast = (message) =&gt; {
      window.clearTimeout(toastTimer);
      toast.textContent = message;
      toast.dataset.visible = &quot;true&quot;;
      toastTimer = window.setTimeout(() =&gt; {
        toast.dataset.visible = &quot;false&quot;;
      }, 2600);
    };

    const copyExpansionPrompt = async (node) =&gt; {
      const prompt = expansionPrompt(node);
      try {
        await navigator.clipboard.writeText(prompt);
        showToast(`Expansion brief copied for ${node.label}.`);
      } catch (_error) {
        const helper = document.createElement(&quot;textarea&quot;);
        helper.value = prompt;
        helper.setAttribute(&quot;readonly&quot;, &quot;&quot;);
        helper.style.position = &quot;fixed&quot;;
        helper.style.opacity = &quot;0&quot;;
        root.appendChild(helper);
        helper.select();
        const copied = document.execCommand(&quot;copy&quot;);
        helper.remove();
        showToast(copied ? `Expansion brief copied for ${node.label}.` : `Use the canonical path: ${node.canonicalPath.join(&quot; → &quot;)}`);
      }
    };

    const renderPath = () =&gt; {
      const path = currentNode().canonicalPath;
      pathElement.replaceChildren();
      path.forEach((segment, index) =&gt; {
        if (index &gt; 0) {
          const separator = document.createElement(&quot;span&quot;);
          separator.textContent = &quot;›&quot;;
          separator.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
          pathElement.appendChild(separator);
        }
        const item = document.createElement(index === path.length - 1 ? &quot;strong&quot; : &quot;span&quot;);
        item.className = &quot;orbit-path-segment&quot;;
        item.textContent = segment;
        pathElement.appendChild(item);
      });
      backButton.hidden = history.length === 1;
    };

    const setSelectedNode = (nodeId) =&gt; {
      selectedId = nodeId;
      const node = ontology[nodeId];
      root.querySelectorAll(&quot;[data-node-id]&quot;).forEach((button) =&gt; {
        button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.nodeId === nodeId));
      });
      root.querySelectorAll(&quot;[data-connection-id]&quot;).forEach((line) =&gt; {
        line.dataset.active = String(line.dataset.connectionId === nodeId &amp;&amp; nodeId !== currentId());
      });
      selectedLabel.textContent = node.label;
      selectedSummary.textContent = node.summary;

      if (nodeId === currentId()) {
        actionButton.hidden = true;
        return;
      }

      actionButton.hidden = false;
      actionButton.textContent = node.children?.length ? `Explore ${node.label}` : `Copy expansion brief`;
      actionButton.setAttribute(&quot;aria-label&quot;, node.children?.length ? `Explore one level inside ${node.label}` : `Copy the canonical expansion brief for ${node.label}`);
    };

    const renderOrbit = () =&gt; {
      const parent = currentNode();
      const positions = positionChildren(parent);
      nodesLayer.replaceChildren();
      connectionsLayer.replaceChildren();
      renderPath();

      parent.children.forEach((childId, index) =&gt; {
        const child = ontology[childId];
        const [x, y] = positions[index];
        const line = document.createElementNS(svgNamespace, &quot;line&quot;);
        line.setAttribute(&quot;x1&quot;, &quot;50&quot;);
        line.setAttribute(&quot;y1&quot;, &quot;50&quot;);
        line.setAttribute(&quot;x2&quot;, String(x));
        line.setAttribute(&quot;y2&quot;, String(y));
        line.setAttribute(&quot;class&quot;, &quot;orbit-connection&quot;);
        line.dataset.connectionId = child.id;
        line.dataset.active = &quot;false&quot;;
        connectionsLayer.appendChild(line);

        const button = document.createElement(&quot;button&quot;);
        button.type = &quot;button&quot;;
        button.className = &quot;btn btn-ghost orbit-node&quot;;
        button.textContent = child.label;
        button.dataset.nodeId = child.id;
        button.dataset.expandable = String(Boolean(child.children?.length));
        button.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
        button.setAttribute(&quot;title&quot;, child.summary);
        button.style.setProperty(&quot;--orbit-x&quot;, `${x}%`);
        button.style.setProperty(&quot;--orbit-y&quot;, `${y}%`);
        button.addEventListener(&quot;click&quot;, () =&gt; setSelectedNode(child.id));
        button.addEventListener(&quot;dblclick&quot;, () =&gt; child.children?.length ? expandSelectedNode(child.id) : copyExpansionPrompt(child));
        nodesLayer.appendChild(button);
      });

      const centreButton = document.createElement(&quot;button&quot;);
      centreButton.type = &quot;button&quot;;
      centreButton.className = &quot;btn btn-primary orbit-node orbit-core&quot;;
      centreButton.dataset.nodeId = parent.id;
      centreButton.setAttribute(&quot;aria-pressed&quot;, &quot;true&quot;);
      centreButton.style.setProperty(&quot;--orbit-x&quot;, &quot;50%&quot;);
      centreButton.style.setProperty(&quot;--orbit-y&quot;, &quot;50%&quot;);
      centreButton.innerHTML = `&lt;span class=&quot;orbit-core-mark&quot; aria-hidden=&quot;true&quot;&gt;☀&lt;/span&gt;&lt;span&gt;${parent.label}&lt;/span&gt;`;
      centreButton.addEventListener(&quot;click&quot;, () =&gt; setSelectedNode(parent.id));
      nodesLayer.appendChild(centreButton);
      setSelectedNode(parent.id);
    };

    function expandSelectedNode(nodeId = selectedId) {
      const node = ontology[nodeId];
      if (!node.children?.length) {
        copyExpansionPrompt(node);
        return;
      }
      history.push(nodeId);
      renderOrbit();
    }

    actionButton.addEventListener(&quot;click&quot;, () =&gt; {
      const node = ontology[selectedId];
      if (node.children?.length) expandSelectedNode(selectedId);
      else copyExpansionPrompt(node);
    });

    backButton.addEventListener(&quot;click&quot;, () =&gt; {
      if (history.length &gt; 1) history.pop();
      renderOrbit();
    });

    root.dataset.canonicalDimensions = canonicalDimensions.join(&quot;,&quot;);
    renderOrbit();
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
