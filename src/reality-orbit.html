        if (ontologyLevel(node) > terminalOntologyLevel) throw new Error(`Ontology depth exceeded: ${node.label}`);
        const children = node.children ?? [];
        if (new Set(children).size !== children.length) throw new Error(`Duplicate child reference: ${node.label}`);
        children.forEach((childId) => {
          const child = ontology[childId];
          if (!child) throw new Error(`Unknown child ${childId} on ${node.label}`);

          "Scope": baseScope,
          "How to use it": "State the level of analysis before comparing evidence, causes, or outcomes.",
          "Common confusion": "Scale is not importance: a larger level is not automatically more valuable or more truthful.",
        };
      }

      if (role === "Time value") {
        return {
          "Purpose": `Use ${node.label} to locate, order, or measure states and change.`,
          "Governing question": `How does ${node.label.toLowerCase()} affect the sequence, duration, or interpretation of events?`,
          "First principles": "State and causation depend on ordering and duration; observations made at different times may describe different conditions.",
          "Mental model": "A position or interval on a timeline used to compare change.",
          "Scope": baseScope,
          "How to use it": "Declare the reference point, interval, and ordering assumptions before drawing comparisons.",
          "Common confusion": "Time describes location and change; it does not by itself establish causation.",
        };
      }

      return {
        "Purpose": `Use ${node.label} to organise and explain the aspect of reality captured by its definition.`,
        "Governing question": `What does ${node.label} help us notice, explain, predict, or decide?`,
        "First principles": "A useful concept needs a clear definition, scope, distinguishing properties, and known limits.",
        "Mental model": "A reusable lens that compresses detail while preserving what matters for a particular purpose.",
        "Scope": baseScope,
        "How to use it": "Check that the situation matches the definition and scope before applying the concept.",
        "Common confusion": "The concept is a representation used for reasoning; it is not identical to the reality it represents.",
      };
    };

    const understandFlowForNode = (node) => {
      const role = roleForNode(node);
      const flows = {
        "Root concept": "Frame → Describe → Connect",
        "Dimension": "Lens → Classification → Context",
        "Named law": "Conditions → Mechanism → Prediction",
        "Relationship type": "Participants → Connection → Consequence",
        "Process type": "Input → Change → Outcome",
        "Resource type": "Capacity → Allocation → Outcome",
        "Perspective lens": "Lens → Emphasis → Interpretation",
        "Scale level": "Level → Pattern → Boundary",
        "Time value": "Reference → Sequence → Change",
      };
      return flows[role] ?? "Meaning → Context → Application";
    };

    const createAnatomyField = ([label, value], className = "") => {
      const field = document.createElement("div");
      field.className = className;
      const term = document.createElement("dt");
      term.className = "text-small";
      term.textContent = label;
      const description = document.createElement("dd");
      description.textContent = value;
      field.append(term, description);
      return field;
    };

    const renderUnderstand = (node) => {
      const role = roleForNode(node);
      const entries = Object.entries(buildConceptAnatomy(node));
      const usedLabels = new Set();
      const take = (labels) => {
        const entry = entries.find(([label]) => labels.includes(label) && !usedLabels.has(label));
        if (entry) usedLabels.add(entry[0]);
        return entry;
      };
      const takeAny = () => {
        const entry = entries.find(([label]) => !usedLabels.has(label));
        if (entry) usedLabels.add(entry[0]);
        return entry;
      };

      const lead = take(["Governing question", "Problem", "Prediction", "First principles"]) ?? takeAny();
      const support = take(["Purpose", "Mechanism", "First principles", "Mental model", "Prediction"]) ?? takeAny();
      const foundations = [
        take(["First principles", "Variables", "Mechanism", "Prediction"]),
        take(["Mental model", "Prediction", "Variables", "Assumptions"]),
      ].filter(Boolean);
      const contextEntries = [
        take(["Scope"]),
        take(["How to use it", "Applications", "Application"]),
        take(["Common confusion", "Limitations", "Related laws"]),
      ].filter(Boolean);
      while (contextEntries.length < 3) {
        const fallback = takeAny();
        if (!fallback) break;
        contextEntries.push(fallback);
      }
      const remaining = entries.filter(([label]) => !usedLabels.has(label));

      understandEyebrow.textContent = `${role} · Concept anatomy`;
      understandTitle.textContent = node.label;
      understandStatement.textContent = node.summary;
      understandFlow.textContent = understandFlowForNode(node);
      understandLeadLabel.textContent = lead[0];
      understandLead.textContent = lead[1];
      understandSupport.textContent = support[1];

      understandFoundations.replaceChildren(...foundations.map((entry) => createAnatomyField(entry)));
      understandFoundations.hidden = foundations.length === 0;

      understandContext.replaceChildren(...contextEntries.map((entry) => createAnatomyField(entry, "card understand-context-card")));
      understandContext.setAttribute("aria-label", `${node.label} context`);

      understandFields.replaceChildren(...remaining.map((entry) => createAnatomyField(entry)));
      understandMore.hidden = remaining.length === 0;
      understandMoreSummary.textContent = remaining.length === 1 ? "1 supporting field" : `${remaining.length} supporting fields`;
    };

    const setSelectedNode = (nodeId) => {
      selectedId = nodeId;
      const node = ontology[nodeId];
      root.querySelectorAll("[data-node-id]").forEach((button) => {
        const selected = button.dataset.nodeId === nodeId;
        button.dataset.selected = String(selected);
        button.setAttribute("aria-current", selected ? "true" : "false");
      });
      const context = buildChatContext(node);
      root.querySelectorAll("[data-connection-id]").forEach((line) => {
        line.dataset.active = String(line.dataset.connectionId === nodeId && nodeId !== currentId());
      });
      selectedLabel.textContent = context.name;
      selectedRole.textContent = context.role;
      selectedSummary.textContent = context.explanation;

      const canExplore = canExploreNode(node);
      const isCurrent = nodeId === currentId();
      actionGroup.hidden = false;
      understandButton.hidden = false;
      understandButton.classList.toggle("btn-primary", !canExplore);
      understandButton.setAttribute("aria-label", `Understand ${node.label}`);
      exploreButton.hidden = !canExplore;
      exploreButton.disabled = canExplore && isCurrent;
      exploreButton.dataset.exploring = String(canExplore && isCurrent);
      exploreButton.textContent = isCurrent ? "Exploring" : "Explore selected";
      exploreButton.setAttribute("aria-pressed", String(canExplore && isCurrent));
      exploreButton.setAttribute("aria-label", isCurrent ? `Currently exploring ${node.label}` : `Explore ${node.label}`);
    };

    const renderOrbit = () => {
      mode = "map";
      const parent = currentNode();
      const positions = positionChildren(parent);
      mapStage.hidden = false;
      detailPanel.hidden = false;
      understandView.hidden = true;
      root.style.setProperty("--map-color", nodeColor(parent));
      nodesLayer.replaceChildren();
      connectionsLayer.replaceChildren();
      renderPath();

      (parent.children ?? []).forEach((childId, index) => {
        const child = ontology[childId];
        const [x, y] = positions[index];
        const color = nodeColor(child);
        const line = document.createElementNS(svgNamespace, "line");
        line.setAttribute("x1", "50");
        line.setAttribute("y1", "50");
        line.setAttribute("x2", String(x));
        line.setAttribute("y2", String(y));
        line.setAttribute("class", "orbit-connection");
        line.dataset.connectionId = child.id;
        line.dataset.relationship = relationshipForNode(child);
        line.dataset.active = "false";
        line.style.setProperty("--connection-color", color);
        connectionsLayer.appendChild(line);

        const button = document.createElement("button");
        button.type = "button";
        button.className = "btn btn-ghost orbit-node";
        button.dataset.nodeId = child.id;
        button.dataset.nodeKind = child.kind === "law-instance" ? "instance" : "container";
        button.dataset.prominence = child.children?.length ? "high" : "standard";
        button.dataset.available = "true";
        button.dataset.selected = "false";
        button.setAttribute("aria-current", "false");
        button.style.setProperty("--orbit-x", `${x}%`);
        button.style.setProperty("--orbit-y", `${y}%`);
        button.style.setProperty("--node-color", color);
        appendDestinationContent(button, child);
        button.addEventListener("click", (event) => {
          setSelectedNode(child.id);
          if (event.detail > 0) button.blur();
        });
        nodesLayer.appendChild(button);
      });

      const centreButton = document.createElement("button");
      centreButton.type = "button";
      centreButton.className = "btn btn-ghost orbit-node orbit-core";
      centreButton.dataset.nodeId = parent.id;
      centreButton.dataset.nodeKind = parent.kind === "law-instance" ? "instance" : "container";
      centreButton.dataset.prominence = "high";
      centreButton.dataset.available = "true";
      centreButton.dataset.selected = "true";
      centreButton.setAttribute("aria-current", "true");
      centreButton.style.setProperty("--orbit-x", "50%");
      centreButton.style.setProperty("--orbit-y", "50%");
      centreButton.style.setProperty("--node-color", nodeColor(parent));
      appendDestinationContent(centreButton, parent);
      centreButton.addEventListener("click", (event) => {
        setSelectedNode(parent.id);
        if (event.detail > 0) centreButton.blur();
      });
      nodesLayer.appendChild(centreButton);
      setSelectedNode(parent.id);
    };

    function exploreSelectedNode(nodeId = selectedId) {
      const node = ontology[nodeId];
      if (!node || node.id === currentId() || !canExploreNode(node)) return;
      history.push(nodeId);
      renderOrbit();
    }

    function openUnderstand(nodeId = selectedId) {
      const node = ontology[nodeId];
      if (!node) return;
      history.push(nodeId);
      selectedId = nodeId;
      mode = "understand";
      renderPath();
      mapStage.hidden = true;
      detailPanel.hidden = true;
      understandView.hidden = false;
      actionGroup.hidden = true;
      renderUnderstand(node);
    }

    exploreButton.addEventListener("click", () => exploreSelectedNode(selectedId));
    understandButton.addEventListener("click", () => openUnderstand(selectedId));

    backButton.addEventListener("click", () => {
      if (history.length > 1) history.pop();
      if (mode === "understand") mode = "map";
      renderOrbit();
    });

    root.dataset.canonicalDimensions = canonicalDimensions.join(",");
    root.dataset.terminalOntologyLevel = String(terminalOntologyLevel);
    validateOntology();
    renderOrbit();
  })();
</script>
