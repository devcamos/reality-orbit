name: Playwright

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  e2e:
    name: Chromium E2E
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 20

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium and system dependencies
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run browser journeys
        run: npm run test:e2e

      - name: Publish Playwright quality gate
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const reporter = require("./.github/scripts/playwright-pr-summary.cjs");
            await reporter.publishSummary({ core, context, github });

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ctrf/
            playwright-report/
            test-results/
          retention-days: 14
