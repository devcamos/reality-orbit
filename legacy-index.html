b,

.form-switch .form-check-input:checked {

}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);

}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);

svg {

      &quot;compound-effect&quot;: {

        summary: &quot;The principle that repeated changes can accumulate over time because each result becomes part of the starting point for the next cycle.&quot;,

        anatomy: {
          &quot;Statement&quot;: &quot;The compound effect describes how repeated changes can accumulate over time when each period&#x27;s result becomes part of the base for the next period.&quot;,
          &quot;First principles&quot;: &quot;A changing state can become the input to the next change. Repeated proportional change is multiplicative, not simply additive.&quot;,

          &quot;Mechanism&quot;: &quot;Each cycle applies change to the current state, so gains and losses can both become larger or smaller over repeated cycles.&quot;,
          &quot;Predictions&quot;: &quot;With a stable positive rate and sufficient time, later changes contribute more than early ones; negative compounding can also magnify losses or deterioration.&quot;,
          &quot;Assumptions&quot;: &quot;The relevant effect carries forward between cycles and the stated rate or practice remains meaningful across the time horizon.&quot;,
          &quot;Limitations&quot;: &quot;Not every repeated action compounds. Outcomes can plateau, reverse, be capped, or be dominated by chance, unequal access, and changing conditions.&quot;,
          &quot;Applications&quot;: &quot;Use it to reason about investment returns, reliability debt, learning practice, habits, and small operational improvements without promising guaranteed results.&quot;,
          &quot;Visual demonstration&quot;: &quot;Animate two identical starting states: one receives a small repeated change that carries forward, while the other remains flat; then show how the gap changes over time.&quot;,

      &quot;pareto-principle&quot;: {

        summary: &quot;A heuristic that, in some systems, a minority of inputs, causes, or contributors accounts for a disproportionate share of outcomes.&quot;,

        anatomy: {
          &quot;Statement&quot;: &quot;The Pareto principle suggests that some systems have highly uneven distributions, where a minority of inputs or causes produces a disproportionate share of outcomes.&quot;,
          &quot;First principles&quot;: &quot;Outcomes need not be evenly distributed. Differences in exposure, capacity, feedback, accumulation, and constraints can create concentration.&quot;,

          &quot;Predictions&quot;: &quot;Where concentration is present, prioritising high-contribution causes can be more effective than treating every cause as equally important.&quot;,
          &quot;Assumptions&quot;: &quot;The chosen metric and population are relevant, reliable, and stable enough for a prioritisation decision.&quot;,

      &quot;potential-emergence&quot;: {

        label: &quot;Potential emergence&quot;,
        summary: &quot;A teaching framework for how inherited potential becomes conscious agency through mind, body, incubation, and catalytic pressure.&quot;,

        anatomy: {
          &quot;Purpose&quot;: &quot;Use Potential emergence to study how unused human capacity becomes self-awareness, vocation, or will without treating myth as biography or destiny.&quot;,
          &quot;Governing question&quot;: &quot;What inherited capacity is being formed, by which mental and material conditions, and what pressure would force it into action?&quot;,
          &quot;First principles&quot;: &quot;People inherit unused biological and cultural capacity. Mind supplies direction; body and setting supply the vessel; a catalyst is required before agency appears.&quot;,
          &quot;Mental model&quot;: &quot;An uncarved stone incubated by Heaven and Earth until wind cracks the shell and an unrefined, high-energy self steps out.&quot;,
          &quot;Scope&quot;: &quot;This framework teaches a developmental sequence. It is an allegory mapped onto psychology, not a claim that the Journey to the West birth story is ontology.&quot;,
          &quot;How to use it&quot;: &quot;Name the unused capacity, the mental influences, the bodily and environmental conditions, the forming self-image, and the pressure that would force action.&quot;,
          &quot;Common confusion&quot;: &quot;The stone monkey is unrefined ego before discipline, not finished genius. Pressure without incubation is only stress.&quot;,
          &quot;Immortality Stone&quot;: &quot;The mountain rock stands for the unconscious mind and unused human potential: inherited biological, psychological, and environmental capacity waiting to be tapped.&quot;,

          &quot;Divine Embryo&quot;: &quot;The stone egg is the spark of genius or self-awareness: the moment a person realises who they are or what they can do.&quot;,
          &quot;Wind&quot;: &quot;The hatching wind is a catalyst, crisis, or extreme pressure that splits the hard exterior and forces unused capacity into the world.&quot;,
          &quot;Stone Monkey&quot;: &quot;Wukong is the unrefined, high-energy human ego and potential—the monkey mind—before later discipline shapes it.&quot;,

          &quot;Applies when&quot;: &quot;Use Potential emergence when asking how dormant talent becomes will, vocation, or self-awareness rather than remaining unused inheritance.&quot;,
          &quot;Breaks when&quot;: &quot;It breaks when the myth is treated as biography, destiny, or proof; the stages are teaching metaphors, not causal laws.&quot;,

      survival: {

        anatomy: {
          &quot;Purpose&quot;: &quot;Use Survival to see what does not negotiate, what remains a human choice, and which inherited path made those the constraints we live inside.&quot;,

          &quot;First principles&quot;: &quot;Bodies need energy, water, temperature range, and time. Death ends a lineage that cannot meet those needs. Culture, story, and meaning can change how we meet the same constraints; they do not repeal them.&quot;,
          &quot;Mental model&quot;: &quot;Three columns: Fact (given), Negotiable (chosen or interpreted), Path (how evolution and history arrived here). Fill all three before acting.&quot;,
          &quot;Scope&quot;: &quot;This framework organises reading, not a biological taxonomy. It does not add Bible, Third eye, History, or Evolution nodes. Understanding is the outcome; related living systems stay under Biological and Environment.&quot;,
          &quot;How to use it&quot;: &quot;Name the constraint that does not move. Name what people still choose. Name the inherited path that made those the terms. Then compare Organism, Ecosystem, and OODA Loop.&quot;,
          &quot;Common confusion&quot;: &quot;Survival is not a how-to wilderness method, not scripture, and not proof that a myth or market is natural. Fact is not the same as familiar.&quot;,
          &quot;Fact&quot;: &quot;What does not negotiate inside the situation: metabolism, gravity, temperature, time, death, and the mineral and chemical conditions a body depends on.&quot;,

      &quot;amdahls-law&quot;: {
        id: &quot;amdahls-law&quot;,
        label: &quot;Amdahl&#x27;s Law&quot;,
        kind: &quot;law-instance&quot;,
        summary: &quot;For a fixed workload, the serial portion sets the upper limit on the speedup gained from parallel execution.&quot;,
        canonicalPath: [&quot;Reality&quot;, &quot;Category&quot;, &quot;Knowledge&quot;, &quot;Law&quot;, &quot;Amdahl&#x27;s Law&quot;],
        anatomy: {
          &quot;Problem&quot;: &quot;Adding processors does not keep producing proportional performance improvements.&quot;,
          &quot;Statement&quot;: &quot;For a fixed workload, the serial portion sets the upper limit on the speedup gained from parallel execution.&quot;,
          &quot;First principles&quot;: &quot;A finite workload contains work that can run in parallel and work that must remain serial. Parallel resources cannot accelerate serial work.&quot;,
          &quot;Variables&quot;: &quot;Parallel fraction, serial fraction, processor count, and total speedup.&quot;,
          &quot;Mental model&quot;: &quot;Widening most lanes on a road cannot remove the delay caused by one remaining single-lane section.&quot;,
          &quot;Mechanism&quot;: &quot;Parallel work becomes faster as processors are added, while serial work remains fixed and therefore becomes the dominant share of elapsed time.&quot;,
          &quot;Predictions&quot;: &quot;Performance gains flatten as processor count rises, and the serial fraction determines the ceiling.&quot;,
          &quot;Scope&quot;: &quot;Fixed-size workloads whose parallel and serial portions can be estimated.&quot;,
          &quot;Assumptions&quot;: &quot;The workload is fixed, the parallel fraction remains stable, and coordination overhead is negligible.&quot;,
          &quot;Evidence or derivation&quot;: &quot;The relationship follows mathematically by adding the unchanged serial time to the parallel time divided across processors.&quot;,
          &quot;Limitations&quot;: &quot;Real systems add communication, scheduling, memory, and coordination overhead; workloads may also grow with available capacity.&quot;,
          &quot;Applications&quot;: &quot;Parallel algorithm design, capacity planning, performance profiling, and deciding whether to optimise serial work or add processors.&quot;,
          &quot;Visual demonstration&quot;: &quot;Change processor count and parallel fraction, then observe the speedup curve approach a ceiling.&quot;,
          &quot;Related laws&quot;: &quot;Gustafson&#x27;s Law offers a complementary view by allowing the workload to scale with available processors.&quot;,
        },
      },
      &quot;brooks-law&quot;: {
        id: &quot;brooks-law&quot;,
        label: &quot;Brooks&#x27;s Law&quot;,
        kind: &quot;law-instance&quot;,
        summary: &quot;Adding people to a late software project can make it later because coordination and onboarding add work.&quot;,
        canonicalPath: [&quot;Reality&quot;, &quot;Category&quot;, &quot;Knowledge&quot;, &quot;Law&quot;, &quot;Brooks&#x27;s Law&quot;],
        anatomy: {
          &quot;Statement&quot;: &quot;Adding people to a late software project can make it later because coordination and onboarding add work.&quot;,
          &quot;First principles&quot;: &quot;Work must be divided, communicated, integrated, and checked. Adding people increases coordination paths and temporarily consumes experienced-team capacity.&quot;,
          &quot;Variables&quot;: &quot;Team size, remaining schedule, task independence, onboarding load, integration work, and experienced-team availability.&quot;,
          &quot;Mechanism&quot;: &quot;New contributors need context, access, reviews, and coordination. Their arrival creates communication and integration work before they can reduce delivery work.&quot;,
          &quot;Predictions&quot;: &quot;Late staffing produces an initial productivity dip; highly coupled work suffers more; independent, well-specified work can absorb help more safely.&quot;,
          &quot;Assumptions&quot;: &quot;The project is already late, work has meaningful interdependence, and new people require onboarding from the existing team.&quot;,
          &quot;Limitations&quot;: &quot;This is a management heuristic, not a fixed equation. Additional capacity can help when work is genuinely separable and onboarding is low.&quot;,
          &quot;Applications&quot;: &quot;Staffing decisions, delivery recovery plans, dependency reduction, onboarding design, and explaining why parallel hiring is not an automatic schedule fix.&quot;,
          &quot;Visual demonstration&quot;: &quot;Increase team size while showing communication links, onboarding demand, and the delayed point at which added capacity becomes productive.&quot;,
          &quot;Related laws&quot;: &quot;Conway&#x27;s Law explains the architectural effect of communication structure; Amdahl&#x27;s Law explains why parallel capacity has ceilings.&quot;,
        },
      },
      &quot;conways-law&quot;: {
        id: &quot;conways-law&quot;,
        label: &quot;Conway&#x27;s Law&quot;,
        kind: &quot;law-instance&quot;,
        summary: &quot;The structures organisations design tend to mirror their communication structures.&quot;,
        canonicalPath: [&quot;Reality&quot;, &quot;Category&quot;, &quot;Knowledge&quot;, &quot;Law&quot;, &quot;Conway&#x27;s Law&quot;],
        anatomy: {
          &quot;Statement&quot;: &quot;The structures organisations design tend to mirror their communication structures.&quot;,
          &quot;First principles&quot;: &quot;System interfaces require coordination. Organisational boundaries, incentives, language, and information flow shape which coordination is easy or costly.&quot;,
          &quot;Variables&quot;: &quot;Team boundaries, communication paths, decision rights, system interfaces, ownership, and deployment independence.&quot;,
          &quot;Mechanism&quot;: &quot;Teams optimise around their available communication paths. Those paths influence the interfaces and coupling they create between technical components.&quot;,
          &quot;Predictions&quot;: &quot;Tightly coupled teams tend to produce tightly coupled systems; changing team topology changes pressure on architectural boundaries.&quot;,
          &quot;Assumptions&quot;: &quot;The organisation has enough influence over design and delivery for communication patterns to shape technical decisions.&quot;,
          &quot;Limitations&quot;: &quot;It describes a tendency, not destiny. Deliberate architecture, shared platforms, and cross-team practices can counter or redirect the effect.&quot;,
          &quot;Applications&quot;: &quot;Team-topology design, service ownership, architecture reviews, platform boundaries, and organisational change planning.&quot;,
          &quot;Visual demonstration&quot;: &quot;Rearrange communication links between teams and observe the corresponding component interfaces and coupling on a system map.&quot;,
          &quot;Related laws&quot;: &quot;Brooks&#x27;s Law concerns coordination cost; Goodhart&#x27;s Law helps examine whether team measures distort desired architecture.&quot;,
        },
      },
      &quot;goodharts-law&quot;: {
        id: &quot;goodharts-law&quot;,
        label: &quot;Goodhart&#x27;s Law&quot;,
        kind: &quot;law-instance&quot;,
        summary: &quot;When a measure becomes a target, people adapt to the target and the measure often loses its value as evidence.&quot;,
        canonicalPath: [&quot;Reality&quot;, &quot;Category&quot;, &quot;Knowledge&quot;, &quot;Law&quot;, &quot;Goodhart&#x27;s Law&quot;],
        anatomy: {
          &quot;Statement&quot;: &quot;When a measure becomes a target, people adapt to the target and the measure often loses its value as evidence.&quot;,
          &quot;First principles&quot;: &quot;Measures are proxies for outcomes. Incentives change behaviour, and actors can optimise the proxy without improving the underlying outcome.&quot;,
          &quot;Variables&quot;: &quot;True outcome, proxy metric, target threshold, incentive strength, actor discretion, and measurement coverage.&quot;,
          &quot;Mechanism&quot;: &quot;Once rewards or penalties depend on a measure, attention shifts toward improving the measured signal, including through substitution, gaming, or narrowing effort.&quot;,
          &quot;Predictions&quot;: &quot;The metric improves faster than the underlying outcome; unintended behaviours emerge; performance degrades where the proxy has blind spots.&quot;,
          &quot;Assumptions&quot;: &quot;Actors can influence the measure and face a meaningful incentive to do so; the measure is incomplete relative to the true objective.&quot;,
          &quot;Limitations&quot;: &quot;Targets are not automatically harmful. Well-designed, multi-signal measures with qualitative review and outcome checks can remain useful.&quot;,
          &quot;Applications&quot;: &quot;KPI design, service-level objectives, incentive design, performance management, risk controls, and dashboard review.&quot;,
          &quot;Visual demonstration&quot;: &quot;Let a user optimise one dashboard metric while hidden outcome measures reveal where the proxy and reality diverge.&quot;,
          &quot;Related laws&quot;: &quot;Parkinson&#x27;s Law concerns time allocation; Conway&#x27;s Law shows how organisational incentives and communication can shape systems.&quot;,
        },
      },
      &quot;greshams-law&quot;: {
        id: &quot;greshams-law&quot;,
        label: &quot;Gresham&#x27;s Law&quot;,
        kind: &quot;law-instance&quot;,
        summary: &quot;When two forms of money are accepted at the same nominal value, the overvalued form tends to circulate while the undervalued form is retained or exported.&quot;,
        canonicalPath: [&quot;Reality&quot;, &quot;Category&quot;, &quot;Knowledge&quot;, &quot;Law&quot;, &quot;Gresham&#x27;s Law&quot;],
        pareto: {
          &quot;Applies when&quot;: &quot;Use Gresham&#x27;s Law when two monies are accepted at one nominal value but differ in market or alternative value.&quot;,
          &quot;Decision rule&quot;: &quot;Choose Gresham&#x27;s Law when the less valuable money is spent first and the more valuable money is held or exported.&quot;,
        },
        anatomy: {
          &quot;Statement&quot;: &quot;When two forms of money are accepted at the same nominal value, the overvalued form tends to circulate while the undervalued form is retained or exported.&quot;,
          &quot;First principles&quot;: &quot;People respond to relative value and exchange rules. A fixed official rate can differ from the market value of the underlying money.&quot;,
          &quot;Variables&quot;: &quot;Official exchange rule, market valuation, intrinsic or alternative value, legal-tender acceptance, and ability to retain or export money.&quot;,
          &quot;Mechanism&quot;: &quot;When two monies settle the same debt at an imposed rate, holders prefer to spend the one worth less elsewhere and keep the one worth more.&quot;,
          &quot;Predictions&quot;: &quot;The undervalued money becomes scarce in circulation while the overvalued money is more commonly used for payments.&quot;,
          &quot;Assumptions&quot;: &quot;The monies are accepted at a fixed nominal parity despite different market values, and people can choose which form to spend or retain.&quot;,
          &quot;Limitations&quot;: &quot;It is context-dependent and does not describe every currency system, payment method, or market with flexible exchange rates.&quot;,
          &quot;Applications&quot;: &quot;Monetary history, price controls, exchange-rule analysis, token or voucher design, and incentive reasoning under imposed parity.&quot;,
          &quot;Visual demonstration&quot;: &quot;Set an official parity different from market values and observe which currency rational actors spend versus retain.&quot;,
          &quot;Related laws&quot;: &quot;Goodhart&#x27;s Law helps analyse adaptation to rules and incentives; Metcalfe&#x27;s Law concerns network value rather than monetary value.&quot;,
        },
      },
      &quot;littles-law&quot;: {
        id: &quot;littles-law&quot;,
        label: &quot;Little&#x27;s Law&quot;,
        kind: &quot;law-instance&quot;,
        summary: &quot;In a stable system, average items in the system equal average arrival rate multiplied by average time in the system.&quot;,
        canonicalPath: [&quot;Reality&quot;, &quot;Category&quot;, &quot;Knowledge&quot;, &quot;Law&quot;, &quot;Little&#x27;s Law&quot;],
        anatomy: {
          &quot;Statement&quot;: &quot;In a stable system, average items in the system equal average arrival rate multiplied by average time in the system: L = λW.&quot;,
          &quot;First principles&quot;: &quot;Items enter, spend time within, and leave a system. Over a sufficiently stable period, the average inventory reflects the flow rate multiplied by the average time in flow.&quot;,
          &quot;Variables&quot;: &quot;Average number of items in the system (L), average arrival rate (λ), and average time in the system (W).&quot;,
          &quot;Mechanism&quot;: &quot;The relationship follows from conservation of flow across a stable observation period: more arrivals or longer time in system produce more average work in progress.&quot;,
          &quot;Predictions&quot;: &quot;For a stable rate, increasing time in system raises average queue or work in progress; reducing work in progress can reduce elapsed time when flow is controlled.&quot;,
          &quot;Assumptions&quot;: &quot;The averages are taken over a stable enough period, the system has defined entry and exit boundaries, and the same items are counted consistently.&quot;,
          &quot;Limitations&quot;: &quot;It does not identify the cause of delay, guarantee stability, or replace queueing models for variability, prioritisation, batching, and capacity decisions.&quot;,
          &quot;Applications&quot;: &quot;Service operations, delivery flow, call centres, payment processing, message queues, hospital flow, and capacity dashboards.&quot;,
          &quot;Visual demonstration&quot;: &quot;Change arrival rate or time in system and watch the average number of items in the queue update according to L = λW.&quot;,
          &quot;Related laws&quot;: &quot;Amdahl&#x27;s Law addresses parallel speedup ceilings; Brooks&#x27;s Law addresses coordination effects in project flow.&quot;,
        },
      },
      &quot;metcalfes-law&quot;: {
        id: &quot;metcalfes-law&quot;,
        label: &quot;Metcalfe&#x27;s Law&quot;,
        kind: &quot;law-instance&quot;,
        summary: &quot;The potential value of a compatible communication network grows roughly with the square of its connected users under simplifying assumptions.&quot;,
        canonicalPath: [&quot;Reality&quot;, &quot;Category&quot;, &quot;Knowledge&quot;, &quot;Law&quot;, &quot;Metcalfe&#x27;s Law&quot;],
        anatomy: {
          &quot;Statement&quot;: &quot;The potential value of a compatible communication network grows roughly with the square of its connected users under simplifying assumptions.&quot;,
          &quot;First principles&quot;: &quot;Adding a compatible participant can create possible new connections with existing participants. Pairwise connection opportunities grow faster than node count.&quot;,
          &quot;Variables&quot;: &quot;Number of compatible users, possible connections, connection relevance, interoperability, participation, and network costs.&quot;,
          &quot;Mechanism&quot;: &quot;With n participants, the number of possible pairwise links grows approximately as n(n − 1)/2, increasing the potential for exchange and coordination.&quot;,
          &quot;Predictions&quot;: &quot;Early network growth may feel modest; later compatible growth can create disproportionately more potential interaction and utility.&quot;,
          &quot;Assumptions&quot;: &quot;Participants are mutually compatible, many possible connections are valuable, and connection quality does not collapse as the network grows.&quot;,
          &quot;Limitations&quot;: &quot;Potential connections are not realised value. Real networks have clustering, spam, congestion, unequal participation, quality differences, and governance costs.&quot;,
          &quot;Applications&quot;: &quot;Platform strategy, interoperability choices, communication networks, ecosystem design, and assessing network-effect claims.&quot;,
          &quot;Visual demonstration&quot;: &quot;Add users to a network and compare linear user growth with the faster growth in possible pairwise connections.&quot;,
          &quot;Related laws&quot;: &quot;Conway&#x27;s Law concerns communication structure inside organisations; Goodhart&#x27;s Law cautions against using raw network size as the only success metric.&quot;,
        },
      },
      &quot;parkinsons-law&quot;: {
        id: &quot;parkinsons-law&quot;,
        label: &quot;Parkinson&#x27;s Law&quot;,
        kind: &quot;law-instance&quot;,
        summary: &quot;Work tends to expand to fill the time made available for its completion.&quot;,
        canonicalPath: [&quot;Reality&quot;, &quot;Category&quot;, &quot;Knowledge&quot;, &quot;Law&quot;, &quot;Parkinson&#x27;s Law&quot;],
        anatomy: {
          &quot;Statement&quot;: &quot;Work tends to expand to fill the time made available for its completion.&quot;,
          &quot;First principles&quot;: &quot;When scope, urgency, and completion criteria are loose, people can add refinement, delay decisions, revisit work, or create coordination activity within the available time.&quot;,
          &quot;Variables&quot;: &quot;Time available, scope clarity, decision latency, incentives, review cycles, available capacity, and definition of done.&quot;,

        &quot;Scope&quot;: &quot;Use Domain when the primary subject matter or explanatory field must be established before classifying the subject more precisely.&quot;,
        &quot;How to use it&quot;: &quot;Name the phenomenon and question, select the domain carrying the main explanatory responsibility, then record any other domains needed to understand cross-domain effects.&quot;,
        &quot;Common confusion&quot;: &quot;Domain identifies where inquiry is focused. It does not identify what kind of thing the subject is—that is the role of Category.&quot;,
      },
      category: {
        &quot;Purpose&quot;: &quot;Use Category to identify what kind of entity, relationship, process, resource, environment, or knowledge object is being described.&quot;,
        &quot;Governing question&quot;: &quot;What kind of thing, relationship, process, resource, environment, or knowledge is this?&quot;,
        &quot;First principles&quot;: &quot;Classification depends on explicit defining characteristics and the role a subject plays in context; a subject may participate in several categories without making them interchangeable.&quot;,
        &quot;Mental model&quot;: &quot;A set of labelled forms that distinguishes what something is or does from the field in which it appears.&quot;,
        &quot;Scope&quot;: &quot;Use Category across domains whenever the structural kind of the subject matters to the explanation or navigation.&quot;,
        &quot;How to use it&quot;: &quot;State the subject and its role, compare it with the defining criteria of the candidate categories, then select the category that best matches the current analytical purpose.&quot;,
        &quot;Common confusion&quot;: &quot;Category is not a topic label or an academic field. Domain says where the inquiry sits; Category says what kind of thing is being examined.&quot;,
      },
      time: {
        &quot;Purpose&quot;: &quot;Use Time to locate states and events, establish their order, and describe how conditions persist or change.&quot;,
        &quot;Governing question&quot;: &quot;When does it occur, for how long, and in what order?&quot;,
        &quot;First principles&quot;: &quot;Reference points, sequence, duration, and rate of change affect what can be observed and inferred; observations at different times may describe different states.&quot;,
        &quot;Mental model&quot;: &quot;A timeline and observation window that reveal position, order, persistence, and change.&quot;,
        &quot;Scope&quot;: &quot;Use Time when an explanation depends on when something happened, how long it lasted, what preceded it, or how it changed.&quot;,
        &quot;How to use it&quot;: &quot;Set the reference point and useful granularity, then identify the relevant past, present, future, duration, or sequence before comparing states or events.&quot;,
        &quot;Common confusion&quot;: &quot;Earlier does not automatically mean causal, and a temporal snapshot should not be mistaken for a stable condition.&quot;,
      },
      scale: {
        &quot;Purpose&quot;: &quot;Use Scale to define the level of analysis and reveal patterns that appear or disappear as observations are aggregated.&quot;,
        &quot;Governing question&quot;: &quot;At what level of size, scope, or resolution is it being examined?&quot;,
        &quot;First principles&quot;: &quot;Behaviour and evidence can change across levels; a conclusion about an individual does not automatically hold for a group, organisation, society, or global system.&quot;,
        &quot;Mental model&quot;: &quot;A zoom control that trades local detail for wider structure and emergent patterns.&quot;,
        &quot;Scope&quot;: &quot;Use Scale when the unit of analysis, system boundary, or degree of aggregation affects the claim being made.&quot;,
        &quot;How to use it&quot;: &quot;Name the focal unit and boundary, select the appropriate level, then compare an adjacent scale to test whether the pattern survives aggregation or disaggregation.&quot;,
        &quot;Common confusion&quot;: &quot;Scale is not importance and is not only physical size; it identifies the level at which evidence, causes, and outcomes are being analysed.&quot;,
      },
      perspective: {
        &quot;Purpose&quot;: &quot;Use Perspective to make the viewpoint, assumptions, interests, and standards of interpretation behind an account explicit.&quot;,
        &quot;Governing question&quot;: &quot;From which viewpoint or interpretive lens is it being understood?&quot;,
        &quot;First principles&quot;: &quot;A viewpoint changes what is noticed, valued, and foregrounded, but it does not by itself change the underlying event or the quality of available evidence.&quot;,
        &quot;Mental model&quot;: &quot;A prism that reveals different features of the same subject while preserving the subject as a shared reference point.&quot;,
        &quot;Scope&quot;: &quot;Use Perspective when different observers or interpretive lenses may frame the same subject through different assumptions, priorities, or evidence.&quot;,
        &quot;How to use it&quot;: &quot;Name the observer or lens, state its assumptions and valued evidence, then compare another perspective and identify which facts remain invariant.&quot;,
        &quot;Common confusion&quot;: &quot;Recognising multiple perspectives does not make every interpretation equally supported or turn evidence-based claims into matters of preference.&quot;,
      },
    };

    const buildConceptAnatomy = (node) =&gt; {
      const role = roleForNode(node);
      const summary = node.summary.trim();
      const summaryWithoutStop = summary.replace(/[.!?]+$/, &quot;&quot;);
      const summaryInSentence = `${summaryWithoutStop.charAt(0).toLowerCase()}${summaryWithoutStop.slice(1)}`;
      const parentLabel = node.canonicalPath.at(-2) ?? &quot;Reality&quot;;
      const nodePath = node.canonicalPath.slice(0, -1).join(&quot; › &quot;) || &quot;Reality&quot;;
      const dimensionLabel = node.canonicalPath[1] ?? &quot;Reality&quot;;
      const childLabels = (node.children ?? [])
        .map((childId) =&gt; ontology[childId]?.label)
        .filter(Boolean);
      const joinLabels = (labels) =&gt; labels.length &lt; 2
        ? labels.join(&quot;&quot;)
        : `${labels.slice(0, -1).join(&quot;, &quot;)} and ${labels.at(-1)}`;
      const baseScope = `${node.label} applies when the inquiry concerns ${summaryInSentence}; it does not replace the wider ${parentLabel} context or the other lenses on Reality.`;
      const specificContext = {
        &quot;Governing question&quot;: `What becomes clearer within ${parentLabel} when ${node.label}—${summaryInSentence}—is brought into focus?`,
        &quot;Purpose&quot;: `Use ${node.label} to distinguish ${summaryInSentence} within ${parentLabel}, keeping the inquiry precise without losing its wider path through ${dimensionLabel}.`,
        &quot;First principles&quot;: `For ${node.label}, the defining boundary is specific: ${summary} Its meaning must remain distinct from ${parentLabel}, even when context, time, scale, or perspective changes what is observed.`,
        &quot;Mental model&quot;: `A quiet lens inside ${parentLabel}: bring ${node.label} to the centre and hold ${summaryInSentence} in focus while the surrounding map preserves context.`,
        &quot;Scope&quot;: baseScope,
        &quot;How to use it&quot;: childLabels.length &gt; 0
          ? `Begin with the definition of ${node.label}, then compare its immediate paths—${joinLabels(childLabels)}—and follow the one that best matches the current question.`
          : `Begin with the definition of ${node.label}, compare it with adjacent ideas in ${parentLabel}, then test the same subject through Time, Scale, and Perspective before concluding.`,
        &quot;Common confusion&quot;: `Do not use ${node.label} as shorthand for all of ${parentLabel}. Here it refers specifically to ${summaryInSentence}.`,
      };

      const withParetoFields = (baseAnatomy) =&gt; {
        const anatomy = baseAnatomy ?? {};
        const authoredAnatomy = node.anatomy ?? {};
        const authoredPareto = node.pareto ?? {};
        const firstChildLabel = childLabels[0] ?? &quot;a neighbouring concept&quot;;
        const paretoAnatomy = {
          &quot;Definition&quot;: authoredPareto.Definition ?? node.summary,
          &quot;Mechanism&quot;: authoredPareto.Mechanism
            ?? authoredAnatomy.Mechanism
            ?? `It works by making ${summaryInSentence} the focal feature, then connecting it to ${parentLabel} and testing what changes.`,
          &quot;Applies when&quot;: authoredPareto[&quot;Applies when&quot;]
            ?? authoredAnatomy[&quot;Applies when&quot;]
            ?? `Apply ${node.label} when the inquiry concerns ${summaryInSentence} within ${nodePath}.`,
          &quot;Breaks when&quot;: authoredPareto[&quot;Breaks when&quot;]
            ?? authoredAnatomy.Limitations
            ?? `It breaks when ${node.label} is used outside ${nodePath}, or when another lens changes the result.`,
          &quot;Example&quot;: authoredPareto.Example
            ?? authoredAnatomy.Example
            ?? authoredAnatomy.Applications
            ?? authoredAnatomy[&quot;Visual demonstration&quot;]
            ?? (childLabels.length &gt; 0
              ? `For example, use ${node.label} to distinguish ${joinLabels(childLabels.slice(0, 3))} within ${parentLabel}.`
              : `For example, apply ${node.label} to a case that matches ${summaryInSentence}.`),
          &quot;Counterexample&quot;: authoredPareto.Counterexample
            ?? authoredAnatomy.Counterexample
            ?? (authoredAnatomy.Limitations
              ? `It fails when ${authoredAnatomy.Limitations}`
              : `A counterexample is a case that mentions ${summaryInSentence} without satisfying ${node.label}&#x27;s definition.`),
          &quot;Decision rule&quot;: authoredPareto[&quot;Decision rule&quot;]
            ?? authoredAnatomy[&quot;Decision rule&quot;]
            ?? (role === &quot;Dimension&quot; ? anatomy[&quot;How to use it&quot;] : null)
            ?? `Choose ${node.label} when the question is specifically about ${summaryInSentence}; otherwise use ${firstChildLabel} or another better-fitting lens.`,
        };

        return {
          ...anatomy,
          ...paretoAnatomy,
        };
      };

      if (role === &quot;Root concept&quot;) {
        return withParetoFields({
          &quot;Purpose&quot;: &quot;Use Reality as the shared starting point before choosing what is being studied, what kind of thing it is, when and at what scale it is examined, and from which perspective.&quot;,
          &quot;Governing question&quot;: &quot;Which dimensions are needed to describe the part of reality under discussion?&quot;,
          &quot;First principles&quot;: &quot;Every useful description selects boundaries and leaves detail out; no single dimension provides a complete account.&quot;,
          &quot;Mental model&quot;: &quot;A central reference point surrounded by complementary lenses.&quot;,
          &quot;Scope&quot;: &quot;Reality is the organising root of this ontology, not a claim that the map exhausts everything that exists.&quot;,
          &quot;How to use it&quot;: &quot;Begin here, select the dimension that answers your immediate question, then combine dimensions when one view is insufficient.&quot;,
          &quot;Common confusion&quot;: &quot;Reality is not another peer topic and the map positions are not scientific coordinates.&quot;,
        });
      }

      if (role === &quot;Dimension&quot;) {
        return withParetoFields(dimensionAnatomies[node.id] ?? {
          &quot;Purpose&quot;: `Use ${node.label} as one of the five complementary dimensions for describing reality.`,
          &quot;Governing question&quot;: dimensionQuestions[node.label] ?? `What does ${node.label} reveal about the subject?`,
          &quot;First principles&quot;: &quot;A dimension isolates one aspect of a subject for reasoning; choosing it does not replace the other dimensions.&quot;,
          &quot;Mental model&quot;: &quot;One lens in a multi-lens instrument: it brings a particular feature into focus without becoming the whole picture.&quot;,
          &quot;Scope&quot;: `The ${node.label} dimension can be applied across every subject represented in the ontology.`,
          &quot;How to use it&quot;: `Choose a value within ${node.label}, then combine it with the other relevant dimensions as needed.`,
          &quot;Common confusion&quot;: &quot;A dimension classifies an aspect of a subject; it does not own or completely define that subject.&quot;,
        });
      }

      const roleAnatomy = (() =&gt; {
      if (role === &quot;Domain&quot;) {
        return {
          &quot;Purpose&quot;: `Use ${node.label} to set the broad subject-matter boundary for questions, evidence, and explanations.`,
          &quot;Governing question&quot;: `What becomes visible when ${node.label.toLowerCase()} reality is the primary area of study?`,
          &quot;First principles&quot;: &quot;A domain defines what is being studied; the same phenomenon can legitimately involve more than one domain.&quot;,
          &quot;Mental model&quot;: &quot;A field of inquiry drawn around related phenomena, questions, and methods.&quot;,
          &quot;Scope&quot;: baseScope,
          &quot;How to use it&quot;: `Choose ${node.label} when its subject matter is central, then specify the relevant Category, Time, Scale, and Perspective.`,
          &quot;Common confusion&quot;: &quot;A domain is not a category: Domain says where inquiry is focused, while Category says what kind of thing is being described.&quot;,
        };
      }

      if (role === &quot;Domain concept&quot;) {
        const domain = node.canonicalPath[2];
        return {
          &quot;Purpose&quot;: `Use ${node.label} to describe a recognised concept within the ${domain} domain.`,
          &quot;Governing question&quot;: `How does ${node.label.toLowerCase()} help explain the part of ${domain.toLowerCase()} reality being studied?`,
          &quot;First principles&quot;: &quot;A domain concept gains meaning from both its definition and its relationship to the wider field; it may still connect to other domains.&quot;,
          &quot;Mental model&quot;: `A focused region inside the broader field of ${domain}.`,
          &quot;Scope&quot;: baseScope,
          &quot;How to use it&quot;: `Apply ${node.label} within an explicit ${domain.toLowerCase()} question, then specify the relevant Category, Time, Scale, and Perspective.`,
          &quot;Common confusion&quot;: `Being located within ${domain} does not make ${node.label} isolated from physical, psychological, economic, informational, or other domains.`,
        };
      }

      if (role === &quot;Category type&quot;) {
        return {
          &quot;Purpose&quot;: `Use ${node.label} to state what kind of thing or knowledge object is being described.`,
          &quot;Governing question&quot;: `Is the subject best understood as a ${node.label.toLowerCase()} for the current purpose?`,
          &quot;First principles&quot;: &quot;Classification depends on explicit criteria and purpose; the same subject may participate in several categories without those categories becoming interchangeable.&quot;,
          &quot;Mental model&quot;: &quot;A labelled drawer that groups things by a useful shared characteristic.&quot;,
          &quot;Scope&quot;: baseScope,
          &quot;How to use it&quot;: `Apply ${node.label} after choosing the domain, then test whether its defining characteristics actually fit the subject.`,
          &quot;Common confusion&quot;: &quot;Category identifies kind, not industry, size, time, or viewpoint.&quot;,
        };
      }

      if (role === &quot;Environment type&quot;) {
        return {
          &quot;Purpose&quot;: `Use ${node.label} to distinguish one class of surrounding conditions from the other environmental contexts that may affect a subject.`,
          &quot;Governing question&quot;: `Which conditions make ${node.label.toLowerCase()} the relevant environment for the subject being examined?`,
          &quot;First principles&quot;: &quot;Environmental types organise context by the conditions that exert influence; a real situation can involve several environment types at once.&quot;,
          &quot;Mental model&quot;: &quot;One layer of the surrounding context: it can be separated for analysis while remaining connected to other layers.&quot;,
          &quot;Conditions&quot;: `Look for the actors, boundaries, resources, rules, infrastructure, risks, and feedback specific to the ${node.label.toLowerCase()}.`,
          &quot;Scope&quot;: baseScope,
          &quot;How to use it&quot;: &quot;Use this type to focus the analysis, then connect it to the other environments that also shape the outcome.&quot;,
          &quot;Common confusion&quot;: &quot;An environment type is an analytical category, not a claim that the other surrounding conditions are irrelevant.&quot;,
        };
      }

      if (role === &quot;Environmental setting&quot;) {
        return {
          &quot;Purpose&quot;: `Use ${node.label} as a teachable environmental setting for analysing how conditions shape behaviour and outcomes.`,
          &quot;Governing question&quot;: `What conditions inside and around this ${node.label.toLowerCase()} influence the focal subject, and what feedback might change those conditions?`,
          &quot;First principles&quot;: &quot;Outcomes emerge from interactions among entities, conditions, constraints, resources, rules, and time; no single condition explains the whole result.&quot;,
          &quot;Mental model&quot;: &quot;A bounded setting with actors inside it and conditions around them that shape the available moves.&quot;,
          &quot;Conditions and variables&quot;: &quot;Identify boundaries, participants, resources, information, norms or rules, incentives, infrastructure, risk, and the relevant time horizon.&quot;,
          &quot;Mechanism&quot;: &quot;Conditions change outcomes by enabling, constraining, informing, rewarding, exposing, or coordinating the entities and processes within the setting.&quot;,
          &quot;Feedback&quot;: &quot;Actions inside the setting can reinforce, weaken, or redesign the conditions that shaped them.&quot;,
          &quot;Scope&quot;: baseScope,
          &quot;How to use it&quot;: &quot;Define the focal subject and boundary, map the conditions and relationships, then test which changes would alter the expected outcome.&quot;,
          &quot;Common confusion&quot;: &quot;A setting is not a passive backdrop. It is part of the system of causes, constraints, and feedback.&quot;,
        };
      }

      if (role === &quot;Knowledge type&quot;) {
        return {
          &quot;Purpose&quot;: `Use ${node.label} to identify the form and reasoning job of a knowledge artifact.`,
          &quot;Governing question&quot;: `What kind of knowledge is ${node.label}, and what can it legitimately help someone understand or do?`,
          &quot;First principles&quot;: &quot;Different knowledge types carry different standards of evidence and different uses; a label does not make a claim true.&quot;,
          &quot;Mental model&quot;: &quot;A labelled tool in a reasoning toolkit, selected according to the job it must perform.&quot;,
          &quot;Scope&quot;: baseScope,
          &quot;How to use it&quot;: &quot;State the claim, scope, assumptions, evidence, limitations, and intended application before relying on it.&quot;,
          &quot;Common confusion&quot;: &quot;Laws, principles, razors, frameworks, models, theorems, and patterns are related but not interchangeable.&quot;,
        };
      }

      if (role === &quot;Named knowledge artifact&quot;) {
        return {
          &quot;Purpose&quot;: `Use ${node.label} as a named knowledge artifact whose claim, scope, and practical role can be examined directly.`,
          &quot;Governing question&quot;: `What does ${node.label} claim or organise, and under which conditions is it useful?`,
          &quot;First principles&quot;: &quot;A named artifact is not automatically universal or correct. Its value depends on its definitions, assumptions, evidence or rationale, scope, and limitations.&quot;,
          &quot;Mental model&quot;: &quot;A labelled instrument: it can be useful for a particular reasoning job, but it must be selected and applied with care.&quot;,
          &quot;Scope&quot;: baseScope,
          &quot;How to use it&quot;: &quot;State the problem, identify the artifact&#x27;s intended role, test its assumptions against the situation, and pair it with evidence and relevant constraints.&quot;,
          &quot;Common confusion&quot;: &quot;Knowing an artifact&#x27;s name is not the same as understanding its mechanism, scope, or limitations.&quot;,
        };
      }

      if (role === &quot;Entity type&quot; || role === &quot;Entity instance&quot;) {
        return {
          &quot;Purpose&quot;: `Use ${node.label} to identify the actor or thing whose properties, actions, and relationships are relevant to the question.`,
          &quot;Governing question&quot;: `What makes ${node.label.toLowerCase()} a distinct entity for this analysis, and what can it affect or be affected by?`,
          &quot;First principles&quot;: &quot;An entity is defined by a boundary, identity, properties, and relationships. The useful boundary depends on the purpose and scale of the analysis.&quot;,
          &quot;Mental model&quot;: &quot;A named participant in a system: it has a boundary, state, capabilities, and connections to other participants.&quot;,
          &quot;Scope&quot;: baseScope,
          &quot;How to use it&quot;: &quot;Define identity and boundary, list relevant properties and capabilities, then map the relationships, constraints, and time period that make the entity significant.&quot;,
          &quot;Common confusion&quot;: &quot;An entity is not necessarily a physical object; a person, organisation, software service, account, or decision-making agent can all be treated as entities.&quot;,
        };
      }

      if (role === &quot;Relationship type&quot;) {
        return {
          &quot;Purpose&quot;: `Use ${node.label} to describe a recurring way in which two or more entities are connected.`,
          &quot;Governing question&quot;: `Which entities participate in ${node.label.toLowerCase()}, what defines the connection, and what follows from it?`,
          &quot;First principles&quot;: &quot;A relationship requires participants, a basis for connection, and a context. Direction, symmetry, strength, rights, and duration may change its meaning.&quot;,
          &quot;Mental model&quot;: &quot;A labelled edge between entities whose direction and conditions carry meaning.&quot;,
          &quot;Scope&quot;: baseScope,
          &quot;How to use it&quot;: &quot;Identify the participants, direction, basis, rights or obligations, strength, duration, and context before assigning the relationship type.&quot;,
          &quot;Common confusion&quot;: &quot;A relationship is not an entity, and observing a connection does not by itself establish causation.&quot;,
        };
      }

      if (role === &quot;Process type&quot;) {
        return {
          &quot;Purpose&quot;: `Use ${node.label} to describe an ordered activity or transformation that changes state over time.`,
          &quot;Governing question&quot;: `What enters ${node.label.toLowerCase()}, what changes, and what state or outcome emerges?`,
          &quot;First principles&quot;: &quot;A process has a boundary, an ordering of activity, state before and after, and conditions that influence its outcome.&quot;,
          &quot;Mental model&quot;: &quot;A pathway that transforms an initial state into a later state through ordered activity.&quot;,
          &quot;Scope&quot;: baseScope,
          &quot;How to use it&quot;: &quot;Declare the starting state, inputs, actors, sequence, outputs, timing, and failure conditions.&quot;,
          &quot;Common confusion&quot;: &quot;A process describes change through time; it is not the same as the entity performing it or the resource it consumes.&quot;,
        };
      }

      if (role === &quot;Resource type&quot;) {
        return {
          &quot;Purpose&quot;: `Use ${node.label} to describe an input, capacity, or asset that can enable activity.`,
          &quot;Governing question&quot;: `For which goal is ${node.label.toLowerCase()} useful, who can access it, and what limits its availability?`,
          &quot;First principles&quot;: &quot;Something becomes a resource relative to a goal. Availability, ownership, renewability, substitutability, and consumption determine how it can be used.&quot;,
          &quot;Mental model&quot;: &quot;A limited stock or capacity that can be allocated to enable an outcome.&quot;,
          &quot;Scope&quot;: baseScope,
          &quot;How to use it&quot;: &quot;Specify the goal, quantity or capacity, owner or controller, access conditions, rate of use, replenishment, and competing demands.&quot;,
          &quot;Common confusion&quot;: &quot;A resource is not inherently valuable in every context; its usefulness and scarcity depend on the intended activity.&quot;,
        };
      }

      if (role === &quot;Named law&quot;) {
        return {
          &quot;Purpose&quot;: `Use ${node.label} to reason about the recurring relationship described by its statement.`,
          &quot;Governing question&quot;: &quot;Under which conditions does this relationship hold, and what does it allow us to predict or decide?&quot;,
          &quot;First principles&quot;: &quot;A named law is only meaningful within its scope and assumptions; its name alone does not guarantee universal or scientific status.&quot;,
          &quot;Mental model&quot;: &quot;A compressed relationship between conditions, variables, and an expected outcome.&quot;,
          &quot;Scope&quot;: baseScope,
          &quot;How to use it&quot;: &quot;Identify the variables, test the assumptions, compare the prediction with evidence, and check limitations before acting.&quot;,
          &quot;Common confusion&quot;: &quot;Treating a named law as an exceptionless command rather than a scoped explanatory or predictive relationship.&quot;,
        };
      }

      if (role === &quot;Perspective lens&quot;) {
        return {
          &quot;Purpose&quot;: `Use the ${node.label} perspective to make the assumptions, interests, and evidence behind an interpretation explicit.`,
          &quot;Governing question&quot;: `How does the ${node.label.toLowerCase()} viewpoint change what is noticed, valued, or explained?`,
          &quot;First principles&quot;: &quot;Observation and interpretation are shaped by viewpoint, but changing perspective does not by itself change the underlying event.&quot;,
          &quot;Mental model&quot;: &quot;A camera lens that frames and emphasises some features while leaving others outside the frame.&quot;,
          &quot;Scope&quot;: baseScope,
          &quot;How to use it&quot;: `Apply the ${node.label} lens deliberately, then compare it with another perspective to expose blind spots.`,
          &quot;Common confusion&quot;: &quot;A perspective is an interpretive lens, not proof that every interpretation is equally supported by evidence.&quot;,
        };
      }

      if (role === &quot;Scale level&quot;) {
        return {
          &quot;Purpose&quot;: `Use ${node.label} to fix the level of size, scope, or aggregation at which the subject is examined.`,
          &quot;Governing question&quot;: `Which behaviours are visible at the ${node.label.toLowerCase()} level, and which disappear through aggregation or lack of detail?`,
          &quot;First principles&quot;: &quot;Behaviour can change with scale; conclusions at one level do not automatically transfer to another.&quot;,
          &quot;Mental model&quot;: &quot;A zoom control that changes both visible detail and the patterns that can be recognised.&quot;,
          &quot;Scope&quot;: baseScope,
          &quot;How to use it&quot;: &quot;State the level of analysis before comparing evidence, causes, or outcomes.&quot;,
          &quot;Common confusion&quot;: &quot;Scale is not importance: a larger level is not automatically more valuable or more truthful.&quot;,
        };
      }

      if (role === &quot;Time value&quot;) {
        return {
          &quot;Purpose&quot;: `Use ${node.label} to locate, order, or measure states and change.`,
          &quot;Governing question&quot;: `How does ${node.label.toLowerCase()} affect the sequence, duration, or interpretation of events?`,
          &quot;First principles&quot;: &quot;State and causation depend on ordering and duration; observations made at different times may describe different conditions.&quot;,
          &quot;Mental model&quot;: &quot;A position or interval on a timeline used to compare change.&quot;,
          &quot;Scope&quot;: baseScope,
          &quot;How to use it&quot;: &quot;Declare the reference point, interval, and ordering assumptions before drawing comparisons.&quot;,
          &quot;Common confusion&quot;: &quot;Time describes location and change; it does not by itself establish causation.&quot;,
        };
      }

      return {
        &quot;Purpose&quot;: `Use ${node.label} to organise and explain the aspect of reality captured by its definition.`,
        &quot;Governing question&quot;: `What does ${node.label} help us notice, explain, predict, or decide?`,
        &quot;First principles&quot;: &quot;A useful concept needs a clear definition, scope, distinguishing properties, and known limits.&quot;,
        &quot;Mental model&quot;: &quot;A reusable lens that compresses detail while preserving what matters for a particular purpose.&quot;,
        &quot;Scope&quot;: baseScope,
        &quot;How to use it&quot;: &quot;Check that the situation matches the definition and scope before applying the concept.&quot;,
        &quot;Common confusion&quot;: &quot;The concept is a representation used for reasoning; it is not identical to the reality it represents.&quot;,
      };
      })();

      const anatomy = {
        ...specificContext,
        ...roleAnatomy,
        ...(node.anatomy ?? {}),
      };
      return withParetoFields(anatomy);
    };

    const thoughtForNode = (node) =&gt; {
      const decisionRule = buildConceptAnatomy(node)[&quot;Decision rule&quot;];
      if (decisionRule) return decisionRule;
      if ((node.children?.length ?? 0) &gt; 0) {
        return `What becomes visible when ${node.label} moves to the centre?`;
      }
      return `Where might ${node.label.toLowerCase()} change how you understand the subject?`;
    };

    let orbitPreviewExitTimer = null;
    let orbitPreviewAnchor = null;
    let orbitalCursorHideTimer = null;

    const previewRoleForNode = (node) =&gt; roleForNode(node) === &quot;Dimension&quot; ? &quot;Lens on reality&quot; : roleForNode(node);

    const positionOrbitPreview = (button) =&gt; {
      const stageRect = orbitStage.getBoundingClientRect();
      orbitPreview.style.removeProperty(&quot;--preview-width&quot;);
      const visualRects = [button.querySelector(&quot;.destination-marker&quot;), button.querySelector(&quot;.destination-label&quot;)]
        .filter(Boolean)
        .map((element) =&gt; element.getBoundingClientRect());
      const buttonRect = button.getBoundingClientRect();
      const targetRect = visualRects.length &gt; 0
        ? {
            left: Math.min(...visualRects.map((rect) =&gt; rect.left)),
            right: Math.max(...visualRects.map((rect) =&gt; rect.right)),
            top: Math.min(...visualRects.map((rect) =&gt; rect.top)),
            bottom: Math.max(...visualRects.map((rect) =&gt; rect.bottom)),
          }
        : buttonRect;
      const targetHeight = targetRect.bottom - targetRect.top;
      const naturalPreviewRect = orbitPreview.getBoundingClientRect();
      const edgeGap = 12;
      const nodeGap = 10;
      const availableRight = stageRect.right - targetRect.right - edgeGap;
      const availableLeft = targetRect.left - stageRect.left - edgeGap;
      let placement = &quot;right&quot;;
      if (availableRight &lt; naturalPreviewRect.width + nodeGap &amp;&amp; availableLeft &gt; availableRight) {
        placement = &quot;left&quot;;
      }
      const placementSpace = placement === &quot;right&quot; ? availableRight : availableLeft;
      const previewWidth = Math.min(
        naturalPreviewRect.width,
        Math.max(1, placementSpace - nodeGap),
      );
      orbitPreview.style.setProperty(&quot;--preview-width&quot;, `${previewWidth}px`);
      const previewRect = orbitPreview.getBoundingClientRect();
      const preferredScreenLeft = placement === &quot;right&quot;
        ? targetRect.right + nodeGap
        : targetRect.left - previewRect.width - nodeGap;
      const preferredScreenTop = targetRect.top + ((targetHeight - previewRect.height) / 2);
      const desiredScreenLeft = Math.min(
        Math.max(preferredScreenLeft, stageRect.left + edgeGap),
        stageRect.right - previewRect.width - edgeGap,
      );
      const desiredScreenTop = Math.min(
        Math.max(preferredScreenTop, stageRect.top + edgeGap),
        stageRect.bottom - previewRect.height - edgeGap,
      );
      const localLeft = desiredScreenLeft - stageRect.left;
      const localTop = desiredScreenTop - stageRect.top;

      orbitPreview.dataset.placement = placement;
      orbitPreview.style.setProperty(&quot;--preview-left&quot;, `${localLeft}px`);
      orbitPreview.style.setProperty(&quot;--preview-top&quot;, `${localTop}px`);

      const positionedRect = orbitPreview.getBoundingClientRect();
      orbitPreview.style.setProperty(&quot;--preview-left&quot;, `${localLeft + desiredScreenLeft - positionedRect.left}px`);
      orbitPreview.style.setProperty(&quot;--preview-top&quot;, `${localTop + desiredScreenTop - positionedRect.top}px`);
    };

    const principleItemsFor = (value) =&gt; String(value)

      .map((principle) =&gt; principle.trim())
      .filter(Boolean)
      .map((principle) =&gt; `${principle.charAt(0).toUpperCase()}${principle.slice(1)}`)
      .map((principle) =&gt; /[.!?]$/.test(principle) ? principle : `${principle}.`);

    const escapeRegExp = (value) =&gt; String(value).replace(/[.*+?^${}()|[\]\\]/g, &quot;\\$&amp;&quot;);

    const relatedConceptNodesFor = (value) =&gt; {
      const text = String(value ?? &quot;&quot;);
      const labels = [...new Set(Object.values(ontology).map((node) =&gt; node.label))]
        .sort((left, right) =&gt; right.length - left.length);
      if (labels.length === 0 || !text.trim()) return { matches: [], remainder: text };
      const pattern = new RegExp(labels.map(escapeRegExp).join(&quot;|&quot;), &quot;gi&quot;);
      const seen = new Set();
      const matches = [];
      for (const match of text.matchAll(pattern)) {
        const node = Object.values(ontology).find((candidate) =&gt;
          candidate.label.localeCompare(match[0], undefined, { sensitivity: &quot;accent&quot; }) === 0);
        if (!node || seen.has(node.id)) continue;
        seen.add(node.id);
        matches.push({ node, text: match[0] });
      }
      const remainder = text
        .replace(pattern, &quot; &quot;)
        .replace(/\b(?:and|or)\b/gi, &quot; &quot;)
        .replace(/[.,;:]+/g, &quot; &quot;)
        .replace(/\s+/g, &quot; &quot;)
        .trim();

    const renderUnderstand = (node) =&gt; {
      const role = roleForNode(node);

      const entryFor = (label) =&gt; entries.find(([entryLabel]) =&gt; entryLabel === label);
      const paretoLabels = [

      const paretoEntries = paretoLabels.map(entryFor).filter(Boolean);
      const entryForField = (label) =&gt; paretoEntries.find(([entryLabel]) =&gt; entryLabel === label);
      const hiddenLegacyFields = new Set([
        ...paretoLabels,
        &quot;Governing question&quot;,
        &quot;Purpose&quot;,
        &quot;First principles&quot;,
        &quot;Mental model&quot;,
        &quot;Scope&quot;,
        &quot;How to use it&quot;,
        &quot;Common confusion&quot;,

      const remaining = entries.filter(([label]) =&gt; !hiddenLegacyFields.has(label));

      persistSelection(node.id);

      understandFields.hidden = remaining.length === 0;

    const visualModelForNode = (node) =&gt; {

      const isNamedKnowledgeArtifact = roleForNode(node) === &quot;Named knowledge artifact&quot;;

    const appendConceptVisualLink = (graph, start, end) =&gt; {

    const renderConceptVisual = (node) =&gt; {

    window.addEventListener(&quot;message&quot;, (event) =&gt; {
      if (event.source !== window.parent) return;
      if (![
        &quot;reality-orbit:select-node&quot;,
        &quot;reality-orbit:restore-node&quot;,
        &quot;reality-orbit:restore-navigation&quot;,
      ].includes(event.data?.type)) return;
      if (event.data.type === &quot;reality-orbit:restore-navigation&quot;) {
        const restoredPath = Array.isArray(event.data.path)
          ? event.data.path.reduce((path, nodeId) =&gt; {
            if (typeof nodeId !== &quot;string&quot; || !ontology[nodeId]) return path;
            if (path.length === 0 &amp;&amp; nodeId !== &quot;reality&quot;) return path;
            const parent = ontology[path.at(-1)];
            if (path.length &gt; 0 &amp;&amp; !parent?.children?.includes(nodeId)) return path;

          }, [])
          : [];

          ? canonicalPathIds(event.data.selectedNodeId)
          : [];
        const resolvedPath = restoredPath.length === event.data.path?.length
          ? restoredPath
          : selectedPath;
        if (resolvedPath.length === 0) return;
        history.splice(0, history.length, ...resolvedPath);

        return;
      }
      const requestedNode = ontology[event.data.nodeId];
      if (!requestedNode) return;
      if (event.data.type === &quot;reality-orbit:restore-node&quot;) {
        const parent = currentNode();
        if (requestedNode.id === parent.id || parent.children?.includes(requestedNode.id)) {
          setSelectedNode(requestedNode.id, { revealMobileContent: true });
        }
        return;
      }
      if (requestedNode.id !== currentId() &amp;&amp; canExploreNode(requestedNode)) {
        exploreSelectedNode(requestedNode.id, { revealMap: true });
      } else {
        setSelectedNode(requestedNode.id, { revealMobileContent: true });
      }
    });

    const renderOrbit = () =&gt; {
      const parent = currentNode();
      const preferredSelectedId = selectedId;
      const positions = positionChildren(parent);
      resetOrbitPreview();
      root.style.setProperty(&quot;--map-color&quot;, nodeColor(parent));
      nodesLayer.replaceChildren();
      renderPath();

      (parent.children ?? []).forEach((childId, index) =&gt; {
        const child = ontology[childId];
        const [x, y] = positions[index];
        const color = nodeColor(child);

        const button = document.createElement(&quot;button&quot;);
        button.type = &quot;button&quot;;
        button.className = &quot;btn btn-ghost orbit-node&quot;;
        button.dataset.nodeId = child.id;
        button.dataset.nodeKind = child.kind === &quot;law-instance&quot; ? &quot;instance&quot; : &quot;container&quot;;
        button.dataset.prominence = child.children?.length ? &quot;high&quot; : &quot;standard&quot;;
        button.dataset.available = &quot;true&quot;;
        button.dataset.selected = &quot;false&quot;;
        button.setAttribute(&quot;aria-current&quot;, &quot;false&quot;);
        decorateOrbitButton(button, child, index + 1);
        button.style.setProperty(&quot;--orbit-x&quot;, `${x}%`);
        button.style.setProperty(&quot;--orbit-y&quot;, `${y}%`);
        button.style.setProperty(&quot;--node-color&quot;, color);
        appendDestinationContent(button, child);
        bindOrbitPreview(button, child);
        button.addEventListener(&quot;click&quot;, (event) =&gt; {
          setSelectedNode(child.id, { revealMobileContent: true });
          if (event.detail &gt; 0) button.blur();
        });
        nodesLayer.appendChild(button);
      });

      const centreButton = document.createElement(&quot;button&quot;);
      centreButton.type = &quot;button&quot;;
      centreButton.className = &quot;btn btn-ghost orbit-node orbit-core&quot;;
      centreButton.dataset.nodeId = parent.id;
      centreButton.dataset.nodeKind = parent.kind === &quot;law-instance&quot; ? &quot;instance&quot; : &quot;container&quot;;
      centreButton.dataset.prominence = &quot;high&quot;;
      centreButton.dataset.available = &quot;true&quot;;
      centreButton.dataset.selected = &quot;true&quot;;
      centreButton.setAttribute(&quot;aria-current&quot;, &quot;true&quot;);
      decorateOrbitButton(centreButton, parent, 0);
      centreButton.style.setProperty(&quot;--orbit-x&quot;, &quot;50%&quot;);
      centreButton.style.setProperty(&quot;--orbit-y&quot;, &quot;50%&quot;);
      centreButton.style.setProperty(&quot;--node-color&quot;, nodeColor(parent));
      appendDestinationContent(centreButton, parent);
      bindOrbitPreview(centreButton, parent);
      centreButton.addEventListener(&quot;click&quot;, (event) =&gt; {
        setSelectedNode(parent.id, { revealMobileContent: true });
        if (event.detail &gt; 0) centreButton.blur();
      });
      nodesLayer.appendChild(centreButton);
      setSelectedNode(parent.id);
      const preferredNode = ontology[preferredSelectedId];
      if (preferredNode &amp;&amp; (preferredSelectedId === parent.id || parent.children?.includes(preferredSelectedId))) {
        setSelectedNode(preferredSelectedId);
      }
    };

    function exploreSelectedNode(nodeId = selectedId, { revealMap = false } = {}) {
      const node = ontology[nodeId];
      if (!node || node.id === currentId() || !canExploreNode(node)) return;
      transitionOrbit(() =&gt; {
        const canonicalPath = canonicalPathIds(nodeId);
        history.splice(0, history.length, ...(canonicalPath.length &gt; 0 ? canonicalPath : [...history, nodeId]));
        persistNavigation();
      }, { revealMap, direction: 1 });
    }

    const focusOrbitNode = (nodeId) =&gt; {
      const button = [...root.querySelectorAll(&quot;[data-node-id]&quot;)]
        .find((candidate) =&gt; candidate.dataset.nodeId === nodeId);
      button?.focus({ preventScroll: true });
    };

    const transitionOrbit = (commitNavigation, { revealMap = false, direction = 1 } = {}) =&gt; {
      if (root.dataset.cameraState !== &quot;idle&quot;) return;
      const reduceMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches;
      const activeElement = document.activeElement;
      const restoreFocus = activeElement instanceof HTMLElement
        &amp;&amp; root.contains(activeElement)
        &amp;&amp; activeElement.matches(&quot;[data-explore-action], [data-context-explore-action], [data-orbit-back]&quot;);
      const completeNavigation = () =&gt; {
        commitNavigation();
        renderOrbit();
        if (restoreFocus) focusOrbitNode(currentId());
        if (revealMap) revealOrbitMap();
      };

      if (reduceMotion) {
        completeNavigation();
        return;
      }

      root.style.setProperty(&quot;--camera-tilt&quot;, `${direction * 0.32}deg`);
      root.dataset.cameraState = &quot;approaching&quot;;
      window.setTimeout(() =&gt; {
        commitNavigation();
        renderOrbit();
        if (restoreFocus) focusOrbitNode(currentId());
        root.dataset.cameraState = &quot;arriving&quot;;
        requestAnimationFrame(() =&gt; {
          root.dataset.cameraState = &quot;idle&quot;;
          if (revealMap) revealOrbitMap();
        });
      }, 220);
    };

    saveConceptButton.addEventListener(&quot;click&quot;, toggleSavedConcept);
    exploreButton.addEventListener(&quot;click&quot;, () =&gt; exploreSelectedNode(selectedId));
    contextExploreButton.addEventListener(&quot;click&quot;, () =&gt; exploreSelectedNode(selectedId, { revealMap: true }));
    openConceptVisualButton.addEventListener(&quot;click&quot;, openConceptVisual);
    closeConceptVisualButton.addEventListener(&quot;click&quot;, closeConceptVisual);
    replayConceptVisualButton.addEventListener(&quot;click&quot;, playConceptVisual);
    conceptVisualDialog.addEventListener(&quot;click&quot;, (event) =&gt; {
      if (event.target === conceptVisualDialog) closeConceptVisual();
    });

    backButton.addEventListener(&quot;click&quot;, () =&gt; {
      if (history.length &gt; 1) {
        transitionOrbit(() =&gt; {
          history.pop();
          persistNavigation();
        }, { direction: -1 });
      }
    });

    let orbitalCursorFrame = 0;
    let orbitalCursorEvent = null;
    const isCompactViewport = () =&gt; {
      const parentViewportWidth = window.parent === window ? window.innerWidth : window.parent.innerWidth;
      return Math.min(window.innerWidth, parentViewportWidth) &lt;= 980;
    };
    const scheduleOrbitalCursor = (event) =&gt; {
      if (isCompactViewport()
        || window.matchMedia(&quot;(max-width: 980px)&quot;).matches
        || window.matchMedia(&quot;(hover: none) and (pointer: coarse)&quot;).matches
        || touchInteraction
        || performance.now() &lt; orbitalCursorSuppressedUntil) {
        hideOrbitalCursor();
        return;
      }
      orbitalCursorEvent = event;
      if (orbitalCursorFrame) return;
      orbitalCursorFrame = requestAnimationFrame(() =&gt; {
        orbitalCursorFrame = 0;
        if (orbitalCursorEvent) showOrbitalCursor(orbitalCursorEvent);
      });
    };

    root.addEventListener(&quot;mousemove&quot;, scheduleOrbitalCursor);
    root.addEventListener(&quot;pointermove&quot;, (event) =&gt; {
      if (event.pointerType !== &quot;mouse&quot;) scheduleOrbitalCursor(event);
    });
    root.addEventListener(&quot;pointerdown&quot;, (event) =&gt; {
      touchInteraction = event.pointerType === &quot;touch&quot;;
      if (touchInteraction) root.dataset.touchSelected = &quot;false&quot;;
      if (!isCompactViewport() || touchInteraction) showOrbitalCursor(event);
      else hideOrbitalCursor();
    });
    root.addEventListener(&quot;mouseleave&quot;, () =&gt; hideOrbitalCursor());
    root.addEventListener(&quot;pointerleave&quot;, (event) =&gt; {
      if (event.pointerType !== &quot;touch&quot;) hideOrbitalCursor();
    });
    root.addEventListener(&quot;pointerup&quot;, (event) =&gt; {
      if (event.pointerType === &quot;touch&quot;) {
        orbitalCursorSuppressedUntil = performance.now() + 500;
        hideOrbitalCursor();
      }
    });
    root.addEventListener(&quot;pointercancel&quot;, () =&gt; hideOrbitalCursor());
    window.addEventListener(&quot;blur&quot;, () =&gt; hideOrbitalCursor());
    window.addEventListener(&quot;resize&quot;, () =&gt; {
      if (orbitPreviewAnchor &amp;&amp; !orbitPreview.hidden) positionOrbitPreview(orbitPreviewAnchor);
    });

    root.dataset.canonicalDimensions = canonicalDimensions.join(&quot;,&quot;);
    root.dataset.terminalOntologyLevel = String(terminalOntologyLevel);
    root.dataset.defaultOntologyLevel = String(defaultOntologyLevel);
    root.dataset.cameraState = &quot;idle&quot;;
    validateOntology();
    renderSavedConcepts();
    persistNavigation();
    renderOrbit();
    selectionSyncReady = true;
  })();
&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
