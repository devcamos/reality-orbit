# SonarQube Cloud — https://sonarcloud.io/project/configuration?id=devcamos_reality-orbit
# Prefer GitHub Actions analysis with SONAR_TOKEN. If Automatic Analysis is on,
# turn it off for this repo to avoid duplicate scans without coverage.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

sonar.projectKey=devcamos_reality-orbit
sonar.organization=devcamos

sonar.sources=src,scripts,data
sonar.tests=scripts,tests
sonar.test.inclusions=scripts/**/*.test.mjs,tests/**/*.mjs

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Product UI and the large ontology fragment are not unit-covered yet; measure
# contract/script coverage first so new_coverage is real for gate-relevant code.
sonar.coverage.exclusions=\
**/src/reality-orbit.html,\
**/src/components/**,\
**/src/styles/**,\
**/src/App.tsx,\
**/src/main.tsx,\
**/legacy-index.html,\
**/dist/**

sonar.exclusions=\
**/node_modules/**,\
**/dist/**,\
**/coverage/**,\
**/test-results/**,\
**/playwright-report/**,\
**/legacy-index.html
